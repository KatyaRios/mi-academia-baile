<!DOCTYPE html>
<html lang="es">
<head>

    <title>Mi Primer Proyecto Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">
    <h1>Ingeniería Aritmética</h1>
    <input type="number" id="n1" placeholder="Número A">
    <input type="number" id="n2" placeholder="Número B">
    
    <div class="operadores">

        <button onclick="operar('restar')">-</button>

    <h2 id="res">Resultado: -</h2>
</div>
